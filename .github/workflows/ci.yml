name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 同步依赖
        run: uv sync --locked
      - name: 静态检查
        run: uv run ruff check .
      - name: 文档门禁
        run: |
          uv run python scripts/verify_md_links.py
          uv run python scripts/verify_doc_budgets.py
      - name: 测试
        run: uv run pytest
