[project]
name = "yjy-agent-runtime"
version = "0.1.0"
description = "A minimal Agent Runtime implemented from scratch"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[project.scripts]
yjy-agent-runtime = "yjy_agent_runtime:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a configured real LLM endpoint",
]
